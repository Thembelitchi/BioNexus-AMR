name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/tools/embedded-neo4j/pom.xml
      - run: pip install -e ".[dev]"
      - name: Start Neo4j + GDS
        run: |
          nohup tools/embedded-neo4j/run.sh "$RUNNER_TEMP/neo4j" 7687 > "$RUNNER_TEMP/neo4j.log" 2>&1 &
          for i in $(seq 1 150); do
            grep -q "NEO4J READY" "$RUNNER_TEMP/neo4j.log" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/neo4j.log"; exit 1
      - run: pytest -v
        env:
          BIONEXUS_TEST_NEO4J_URI: bolt://127.0.0.1:7687
