[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bionexus-graph"
version = "0.1.0"
description = "Ontology-grounded AMR surveillance knowledge graph (Neo4j + GDS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "neo4j>=5.28",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
verify = ["zstandard>=0.22"]

[project.scripts]
bionexus = "bionexus.cli:main"

[tool.setuptools]
packages = ["bionexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Neo4j (set NEO4J_URI)"]
